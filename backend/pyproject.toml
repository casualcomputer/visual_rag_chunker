[project]
name = "chunking-visualization-backend"
version = "0.1.0"
description = "Python chunking API (LanceDB blog algorithms)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langchain-text-splitters>=0.2.0",
    "tiktoken>=0.5.0",
    "nltk>=3.8.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chunking"]
